services:
  postgres:
    # pgvector image: provides the `vector` type for DocChunk embeddings.
    image: pgvector/pgvector:pg16
    container_name: edullm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edudb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edullm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/edudb
      - LLM_BASE_URL=http://host.docker.internal:8001/v1
      - DOCUMENTS_STORAGE_ROOT=/data/documents
      - PYTHON_RUNNER_URL=http://edullm-python-runner:8000
    volumes:
      - documents_data:/data/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks: [default, sandbox]
    restart: unless-stopped

  # Off-peak ingestion worker. Same image and code as the backend, different
  # entrypoint (a polling loop instead of uvicorn). Shares the documents volume.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edullm-worker
    command: ["python", "-m", "backend.worker.main"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/edudb
      - LLM_BASE_URL=http://host.docker.internal:8001/v1
      - DOCUMENTS_STORAGE_ROOT=/data/documents
    volumes:
      - documents_data:/data/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edullm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Web search of the research agent (backend/app/agent/tools/web.py). Only the
  # backend reaches it, on this network: no published port. The secret key is
  # SEARXNG_SECRET in .env (the settings file in the repo holds none).
  # The research agent's Python (python_runner/, agent/tools/code.py): one
  # fresh Pyodide process per run. Only the backend reaches it, on the
  # internal network sandbox (no internet). Read-only, no rights, small.
  # Keep node as process 1: a run cannot kill it from inside.
  python-runner:
    build:
      context: .
      dockerfile: python_runner/Dockerfile
    container_name: edullm-python-runner
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 1536m
    cpus: 2
    networks: [sandbox]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.11.15-2d500cb6b
    container_name: edullm-searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    restart: unless-stopped

networks:
  # No way out: the Python runner talks to the backend only.
  sandbox:
    internal: true

volumes:
  postgres_data:
  documents_data:
