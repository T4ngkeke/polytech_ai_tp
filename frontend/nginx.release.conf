# The teachers' installation (docker-compose.release.yml): HTTPS on the LAN and
# Tailscale addresses, plain HTTP on 127.0.0.1 only (port 80 of the container).
#
# Upstreams are named containers looked up at request time (Docker DNS):
# nginx starts even if one is down, and keeps working when the backend is
# recreated with a new address. Never a generic name such as "backend": on
# the shared dev network it answers for another container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://edullm-release-backend:8000;
    set $grafana http://edullm-grafana:3000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Course PDF uploads.
        client_max_body_size 50m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers are streamed (SSE) and a research answer can take minutes.
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Grafana for the admin Monitoring tab; only app admins with the
    # monitoring cookie get through (backend/app/routers/monitoring.py).
    location /grafana/ {
        auth_request /_monitoring_auth;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /_monitoring_auth {
        internal;
        proxy_pass $backend/api/admin/monitoring/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
