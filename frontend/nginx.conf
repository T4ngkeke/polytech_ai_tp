# Grafana's live updates use a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Serve static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fallback to index.html for React Router
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend container
    location /api/ {
        # Allow large PDF course-document uploads (Nginx default is only 1MB, so
        # teacher uploads would fail with 413 before reaching FastAPI). Matches the 200 MB backend limit.
        client_max_body_size 200m;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for SSE (Server-Sent Events) streaming. A research
        # answer can take minutes; the backend also sends a keep-alive comment
        # every 15 s, so this is a second safeguard.
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Grafana for the admin Monitoring tab, when the monitoring containers run
    # (docker-compose.override.yml). Looked up at request time, so nginx also
    # starts without them; the tab then says monitoring is not running.
    # Only app admins get through: every request is checked against the
    # monitoring cookie the tab asks for (backend/app/routers/monitoring.py).
    location /grafana/ {
        auth_request /_monitoring_auth;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /_monitoring_auth {
        internal;
        proxy_pass http://backend:8000/api/admin/monitoring/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
