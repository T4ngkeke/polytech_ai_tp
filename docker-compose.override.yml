# Keep the v9 test stack available locally and through Tailscale only.
# The v6 stable stack uses port 80, so v9 keeps port 8080.
#
# The research agent and structured documents are on in this test stack. The
# model server joins the external network edullm-models, and the admin
# settings use its container name (2026-10-13: Qwen3.8-Flash-Next, served as
# "ornith", at http://m4-flashnext-v030:8000/v1 for the LLM, agent and VLM):
#   docker network create edullm-models
#   docker network connect edullm-models m4-flashnext-v030
# The reranker (edullm-reranker, vLLM, BAAI/bge-reranker-v2-m3) and the MinerU
# server (edullm-mineru-vlm, vLLM) run on the same network.
services:
  postgres:
    # This test database still uses default credentials; keep it local.
    ports: !override
      - "127.0.0.1:5432:5432"

  backend:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "100.108.32.29:8000:8000"
    environment:
      - AGENTIC_SEARCH_ENABLED=true
      - STRUCTURED_INGEST_ENABLED=true
      - PDF_STRUCTURED_INGEST_ENABLED=true
      # "Write with AI" on a picture: VLM_MODEL (Flash-Next) was checked to read
      # images; Research view_image uses the same model.
      - STRUCTURED_VISION_ENABLED=true
      # Shown in the admin map as the MinerU server the worker uses by default.
      - PDF_MINERU_SERVER_URL=http://edullm-mineru-vlm:8000/v1
    networks: [default, models]

  worker:
    # PDF extraction: MinerU 3.4.5 in the worker image (WITH_MINERU), its
    # server edullm-mineru-vlm on edullm-models, and the local models and
    # mineru.json in /home/spark-1/edullm-mineru (see PDF_INGESTION.md).
    build:
      args:
        WITH_MINERU: "1"
    environment:
      - STRUCTURED_INGEST_ENABLED=true
      - PDF_STRUCTURED_INGEST_ENABLED=true
      - PDF_MINERU_PYTHON=/opt/mineru/bin/python
      - PDF_MINERU_SERVER_URL=http://edullm-mineru-vlm:8000/v1
      - PDF_MINERU_CONFIG=/opt/mineru-data/mineru.json
    volumes:
      - /home/spark-1/edullm-mineru:/opt/mineru-data:ro
    # The worker reads the same model settings (LLM, VLM) as the backend.
    networks: [default, models]

  frontend:
    ports: !override
      - "127.0.0.1:8080:80"
      - "100.108.32.29:8080:80"

  # Monitoring (documentation/MONITORING.md): Grafana is shown in the admin
  # Monitoring tab under /grafana/ and can be viewed without a login, so it
  # has no port of its own and this stack stays on local and Tailscale
  # addresses only. GRAFANA_ADMIN_PASSWORD and GRAFANA_DB_PASSWORD are in
  # the untracked .env next to this file.
  grafana:
    image: grafana/grafana:12.2.0
    container_name: edullm-grafana
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/system.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: edullm-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [default, models]
    mem_limit: 1g
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: edullm-node-exporter
    command: ["--path.rootfs=/host", "--path.procfs=/host/proc", "--path.sysfs=/host/sys"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m
    restart: unless-stopped

  # GPU use, temperature and power from nvidia-smi. GPU memory is not
  # reported on the DGX Spark: it is the main memory, seen by node-exporter.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: edullm-gpu-exporter
    gpus: all
    mem_limit: 128m
    restart: unless-stopped

  # Which containers run, and their memory and CPU.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: edullm-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpuset,cpu_topology,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:

networks:
  models:
    external: true
    name: edullm-models
