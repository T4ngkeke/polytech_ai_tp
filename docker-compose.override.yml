# Keep the v9 test stack available locally and through Tailscale only.
# The v6 stable stack uses port 80, so v9 keeps port 8080.
#
# The research agent and structured documents are on in this test stack. The
# model server joins the external network edullm-models, and the admin
# settings use its container name (2026-10-13: Qwen3.8-Flash-Next, served as
# "ornith", at http://m4-flashnext-v030:8000/v1 for the LLM, agent and VLM):
#   docker network create edullm-models
#   docker network connect edullm-models m4-flashnext-v030
# The reranker (edullm-reranker, vLLM, BAAI/bge-reranker-v2-m3) and the MinerU
# server (edullm-mineru-vlm, vLLM) run on the same network.
services:
  postgres:
    # This test database still uses default credentials; keep it local.
    ports: !override
      - "127.0.0.1:5432:5432"

  backend:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "100.108.32.29:8000:8000"
    environment:
      - AGENTIC_SEARCH_ENABLED=true
      - STRUCTURED_INGEST_ENABLED=true
      - PDF_STRUCTURED_INGEST_ENABLED=true
      # Shown in the admin map as the MinerU server the worker uses by default.
      - PDF_MINERU_SERVER_URL=http://edullm-mineru-vlm:8000/v1
    networks: [default, models]

  worker:
    # PDF extraction: MinerU 3.4.5 in the worker image (WITH_MINERU), its
    # server edullm-mineru-vlm on edullm-models, and the local models and
    # mineru.json in /home/spark-1/edullm-mineru (see PDF_INGESTION.md).
    build:
      args:
        WITH_MINERU: "1"
    environment:
      - STRUCTURED_INGEST_ENABLED=true
      - PDF_STRUCTURED_INGEST_ENABLED=true
      - PDF_MINERU_PYTHON=/opt/mineru/bin/python
      - PDF_MINERU_SERVER_URL=http://edullm-mineru-vlm:8000/v1
      - PDF_MINERU_CONFIG=/opt/mineru-data/mineru.json
    volumes:
      - /home/spark-1/edullm-mineru:/opt/mineru-data:ro
    # The worker reads the same model settings (LLM, VLM) as the backend.
    networks: [default, models]

  frontend:
    ports: !override
      - "127.0.0.1:8080:80"
      - "100.108.32.29:8080:80"

networks:
  models:
    external: true
    name: edullm-models
