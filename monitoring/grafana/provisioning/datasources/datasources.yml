apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # A login that can read only the columns listed in monitoring/reader_grants.sql.
  - name: EduLLM
    uid: edudb
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    jsonData:
      database: edudb
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 4
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
